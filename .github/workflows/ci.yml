name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only. This workflow uses NO secrets and must stay that way: the frontend holds no
# secrets, only the public API address. Do not add deployment steps here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:contract
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Public value from .env.example (origin only, no /api/v1). Not a secret.
          VITE_API_BASE_URL: http://localhost:8000

      - name: Check build output
        run: npm run check:build
        env:
          VITE_API_BASE_URL: http://localhost:8000
